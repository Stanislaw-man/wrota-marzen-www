<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer</title>
    <link rel="stylesheet" href="style-index.css">
</head>
<body>

    <!-- Główny bezpieczny kontener odporny na reklamy hostingu -->
    <div class="scena-piracka">
        
        <!-- TWOJA MAPA jako główne tło całej sceny -->
        <img src="MapaPiracka3.jpg" id="mapa" alt="Mapa">

        <!-- Ogłoszenie (Środkowa warstwa) -->
        <img src="Papier61.png" id="plakat" alt="Ogłoszenie">
		<!-- NOWOŚĆ: Piracki gwóźdź, który przybije plakat do mapy -->
               <img src="gwozdzik.png" id="gwozdz-plakatu" alt="Gwóźdź">
    

        <!-- Napisy po prawej stronie -->
        <h1 class="napis-explorer">"EXPLORER"</h1>
        <h2 class="napis-rejs">Rejs w NIEZNANE!!</h2>

        <!-- Cztery małe obrazki na mapie -->
        <img src="Pirat2.jpg" alt="Pirat kapitan" class="foto-kapitan">
        <img src="Pirat4.jpg" alt="Czaszka i mapa" class="foto-czaszka">
        <img src="Pirat1.jpg" alt="Pirat załoga" class="foto-zaloga">
        <img src="okretpiracki1.png" alt="Fregata" class="foto-statek">

        <!-- Przycisk (Kotwica/Link do drugiej strony) -->
        <a href="cyrograf.html" class="przycisk-cyrograf">CYROGRAF</a>

    </div>

</body>
</html>
